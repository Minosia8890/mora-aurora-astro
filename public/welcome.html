<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-site-title>Mora Aurora Astro</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
<style>
  .welcome-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  .welcome-brand { display: flex; align-items: center; gap: 14px; }
  .welcome-brand .brand-mark { font-size: 30px; }
  .welcome-brand h1 { font-family: var(--serif); font-size: 34px; font-weight: 600; letter-spacing: 6px; color: var(--ink); margin: 0; }
  .welcome-slogan { margin-top: 18px; color: var(--ink-dim); font-size: 15px; letter-spacing: 2px; }
  .welcome-btn { margin-top: 36px; display: inline-block; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap welcome-wrap">
  <div class="welcome-brand">
    <div class="brand-mark">&#9737;</div>
    <h1 data-site-name>Mora Aurora Astro</h1>
  </div>
  <p class="welcome-slogan">Aurora reveals the threads of fate</p>
  <a id="btnWelcome" class="btn-primary welcome-btn" href="login.html">欢迎进入</a>
</div>
<script src="js/config.js"></script>
</body>
</html>
