<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-site-title data-site-title-prefix="注册">Mora Aurora Astro</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="site">
    <div class="brand">
      <div class="brand-mark">&#9737;</div>
      <h1 data-site-name>Mora Aurora Astro</h1>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换黑白模式"></button>
      <div id="userArea" class="user-area"></div>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>注册账号</h2>
      <p class="sub">注册后可保存偏好、使用充值与会员功能。</p>
      <form id="regForm" novalidate>
        <div class="field">
          <label for="regUser">用户名（2-20 个字符）</label>
          <input type="text" id="regUser" placeholder="起个名字" autocomplete="username">
        </div>
        <div class="field">
          <label for="regPass">密码（至少 6 位）</label>
          <input type="password" id="regPass" placeholder="设置密码" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="regPass2">确认密码</label>
          <input type="password" id="regPass2" placeholder="再输一次" autocomplete="new-password">
        </div>
        <div class="form-msg" id="regMsg"></div>
        <button type="submit" class="btn-primary">注 册</button>
      </form>
      <div class="auth-alt">已有账号？<a href="login.html">直接登录</a></div>
    </div>
  </div>

  <footer class="site" data-site-footer>星座包括黄道十二宫的描述为传统占星文化的通俗解读，仅供娱乐与自我探索参考。</footer>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/notify.js"></script>
<script>
(function () {
  'use strict';
  var form = document.getElementById('regForm');
  var msg = document.getElementById('regMsg');

  // 与登录页一致：只用服务端校验过的会话来跳转，避免陈旧缓存顶掉注册页
  if (Auth.hasSession()) {
    API.auth.me().then(function () { location.href = 'natal.html'; })
      .catch(function () { API.clearSession(); });
  } else if (API.cachedProfile()) {
    API.clearSession();
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    msg.textContent = '';
    var u = document.getElementById('regUser').value.trim();
    var p = document.getElementById('regPass').value;
    var p2 = document.getElementById('regPass2').value;
    var btn = form.querySelector('button[type="submit"]');
    if (btn) btn.disabled = true;
    var r = await Auth.register(u, p, p2);
    if (btn) btn.disabled = false;
    if (!r.ok) { msg.textContent = r.msg; return; }
    location.href = 'natal.html';
  });
})();
</script>
</body>
</html>
